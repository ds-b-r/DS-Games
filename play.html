<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DS Games — Partida compartilhada</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Arial,sans-serif}
#game{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
#controls{position:fixed;z-index:5;left:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 20px);transition:opacity .2s}
button{border:1px solid #ffffff30;border-radius:10px;background:#17152cdd;color:white;padding:10px 12px;font-weight:700}
#status{position:fixed;z-index:6;bottom:10px;left:10px;padding:8px 11px;border-radius:9px;background:#101827d9;color:#cbd5e1;font-size:12px}
body.clean #controls,body.clean #status{opacity:0;pointer-events:none}
#watching #game{display:none}#watching #remote{display:block}
</style></head><body>
<iframe id="game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe><video id="remote" autoplay playsinline></video>
<div id="controls"><button id="share">Transmitir minha tela do jogo</button><button id="watch">Ver tela do parceiro</button><button id="back">Voltar ao jogo</button></div><div id="status">Conectando à sala…</div>
<script>
const API='https://ds-games-api.paulodaniel07oficial.workers.dev';
const token=localStorage.getItem('ds_games_session_v1');
const params=new URLSearchParams(location.search),room=params.get('room'),game=params.get('game');
const games={streetfighter:'https://www.madkidgames.com/full/street-fighter-ii',mk3:'https://www.retrogames.cc/embed/42478-mortal-kombat-3-rev-2-1.html'};
const frame=document.getElementById('game'),remote=document.getElementById('remote'),statusEl=document.getElementById('status');
if(!games[game]||!room||!token){statusEl.textContent='Partida inválida. Volte ao DS Games.'}else frame.src=games[game];
let pc,ws,localStream,remoteStream,watching=false;
function status(t){statusEl.textContent=t}
function send(data){if(ws&&ws.readyState===1)ws.send(JSON.stringify(data))}
function connect(){
 const wsUrl=API.replace(/^https:/,'wss:')+'/api/rooms/'+encodeURIComponent(room)+'/ws';
 ws=new WebSocket(wsUrl,['ds-game',token]);
 ws.onopen=()=>status('Conectado à sala. Abra o jogo nos dois dispositivos.');
 ws.onmessage=async e=>{const m=JSON.parse(e.data);if(m.type==='peer-ready'){status('Parceiro conectado.');}
  if(m.type==='offer'){await ensurePC();await pc.setRemoteDescription(m.offer);const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',answer:a});}
  if(m.type==='answer'&&pc)await pc.setRemoteDescription(m.answer);
  if(m.type==='ice'&&pc&&m.candidate)try{await pc.addIceCandidate(m.candidate)}catch(e){}
  if(m.type==='peer-left')status('O parceiro saiu da sala.');
 };
 ws.onerror=()=>status('Falha na conexão da sala.');
}
async function ensurePC(){
 if(pc)return pc;
 pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',candidate:e.candidate})};
 pc.ontrack=e=>{remoteStream=e.streams[0];remote.srcObject=remoteStream;status('Tela do parceiro disponível.')};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='connected')status('Transmissão conectada.')};
 return pc;
}
document.getElementById('share').onclick=async()=>{
 try{
  if(!navigator.mediaDevices?.getDisplayMedia)throw new Error('Este navegador não permite compartilhar a tela.');
  localStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:24},audio:false});
  await ensurePC();localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);send({type:'offer',offer});
  document.body.classList.add('clean');status('Compartilhando esta aba. Para parar, use os controles do navegador.');
  localStream.getVideoTracks()[0].onended=()=>{document.body.classList.remove('clean');status('Compartilhamento encerrado.')};
 }catch(e){status(e.message||'Não foi possível iniciar o compartilhamento.')}
};
document.getElementById('watch').onclick=()=>{watching=true;document.body.id='watching';remote.style.display='block';remote.play().catch(()=>{});status('Visualizando a tela do parceiro.')};
document.getElementById('back').onclick=()=>{watching=false;document.body.id='';remote.style.display='none';document.body.classList.remove('clean');status('Exibindo seu jogo.')};
connect();
</script></body></html>
