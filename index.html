<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131c">
<title>DS Subway — Jogar</title>
<style>
:root {
  --bg: #10131c;
  --panel: #1a2130;
  --line: #303a4e;
  --purple: #8b5cf6;
  --mint: #25d6a1;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}
header {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px clamp(14px, 3vw, 32px);
  border-bottom: 1px solid var(--line);
  background: #121722;
}
.brand {
  font-size: clamp(17px, 2vw, 20px);
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
}
.brand b {
  display: inline-grid;
  place-items: center;
  background: var(--purple);
  border-radius: 9px;
  padding: 8px;
  margin-right: 8px;
}
main {
  width: min(100% - 32px, 1280px);
  margin: clamp(18px, 3vw, 32px) auto;
}
.heading { text-align: center; margin: 18px 0 24px; }
.eyebrow {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--mint);
  font-weight: bold;
}
h1 { font-size: clamp(28px, 5vw, 46px); margin: 8px 0 6px; }
.sub { color: #aab4c5; margin: 0; }
.shell {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: clamp(10px, 1.5vw, 16px);
  box-shadow: 0 20px 60px #0005;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 2px 2px 14px;
}
.game-name { font-weight: 800; }
.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
button {
  min-height: 42px;
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  font: inherit;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible {
  outline: 3px solid #fff;
  outline-offset: 3px;
}
.full { background: var(--mint); color: #10231e; }
.reload { background: #30394b; color: #fff; }
.frame-wrap {
  position: relative;
  width: 100%;
  height: clamp(460px, 72vh, 780px);
  height: clamp(460px, 72dvh, 780px);
  background: #080b12;
  border-radius: 12px;
  overflow: hidden;
}
iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
  background: #080b12;
}
.credit {
  margin: 10px 2px 0;
  text-align: center;
  font-size: 12px;
  color: #aab4c5;
}
.credit a { color: #c5b4ff; }
.hint {
  text-align: center;
  color: #9da9bc;
  font-size: 12px;
  line-height: 1.5;
  padding: 10px 8px 2px;
}
body.expanded { overflow: hidden; }
body.expanded header,
body.expanded .heading,
body.expanded .credit,
body.expanded .hint { display: none; }
body.expanded main {
  width: 100%;
  max-width: none;
  margin: 0;
}
body.expanded .shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #080b12;
}
body.expanded .toolbar {
  flex: 0 0 auto;
  padding: 8px 12px;
}
body.expanded .frame-wrap {
  flex: 1 1 auto;
  width: 100%;
  height: auto;
  min-height: 0;
  border-radius: 0;
}
@media (orientation: portrait) {
  body.expanded .frame-wrap {
    flex: 0 0 auto;
    width: min(100vw, calc((100dvh - 58px) * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    align-self: center;
    margin: auto 0;
  }
}
@media (min-width: 1500px) {
  main { width: min(100% - 64px, 1400px); }
  .frame-wrap { height: min(76vh, 900px); }
}
@media (max-width: 700px) {
  header { min-height: 58px; }
  main {
    width: calc(100% - 20px);
    margin: 14px auto 22px;
  }
  .heading { margin: 14px 0 18px; }
  .shell { border-radius: 14px; padding: 9px; }
  .toolbar {
    align-items: stretch;
    flex-direction: column;
    gap: 10px;
    padding: 2px 1px 10px;
  }
  .game-name { font-size: 14px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; }
  button {
    width: 100%;
    min-height: 44px;
    padding: 10px 8px;
    font-size: 13px;
  }
  .frame-wrap {
    height: auto;
    min-height: 0;
    max-height: none;
    aspect-ratio: 16 / 9;
    border-radius: 9px;
  }
  .credit, .hint { font-size: 11px; }
}
@media (max-width: 380px) {
  main { width: calc(100% - 14px); }
  .brand { font-size: 16px; }
  .brand b { padding: 7px; margin-right: 5px; }
  .frame-wrap { min-height: 360px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .frame-wrap { height: 78vh; height: 78dvh; min-height: 250px; }
  body.expanded .frame-wrap {
    height: calc(100vh - 54px);
    height: calc(100dvh - 54px);
  }
}
</style>
</head>
<body>
<header><div class="brand"><b>DS</b>SUBWAY</div><span style="font-size:12px;color:#aab4c5">ARCADE</span></header>
<main>
  <section class="heading"><div class="eyebrow">DS GAMES</div><h1>Subway Surfers</h1><p class="sub">Jogue nesta página.</p></section>
  <section class="shell" id="gameShell">
    <div class="toolbar"><div class="game-name">🎮 Subway Surfers</div><div class="actions"><button class="reload" id="reload">Recarregar</button><button class="full" id="fullscreen">Tela cheia ⛶</button></div></div>
    <div class="frame-wrap">
      <iframe id="gameFrame" title="Subway Surfers incorporado via MadKidGames" src="https://www.madkidgames.com/full/subway-surfers" allow="fullscreen; autoplay; gamepad" allowfullscreen scrolling="no" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <p class="credit">Jogo incorporado via <a href="https://www.madkidgames.com/game/subway-surfers" target="_blank" rel="noopener noreferrer">MadKidGames</a>.</p>
    <p class="hint">Se o jogo não carregar, confira as exigências de incorporação e aprovação do provedor descritas no README.</p>
  </section>
</main>
<script>
const frame=document.getElementById('gameFrame');
document.getElementById('reload').addEventListener('click',()=>{frame.src=frame.src;});
document.getElementById('fullscreen').addEventListener('click',async()=>{
  const target=document.getElementById('gameShell');
  try {
    if(!document.fullscreenElement){await target.requestFullscreen();document.body.classList.add('expanded');}
    else {await document.exitFullscreen();}
  } catch(e) { alert('Tela cheia não está disponível neste navegador.'); }
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('expanded');});
</script>
</body>
</html>
