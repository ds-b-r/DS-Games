<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>DS Subway — Jogar</title>
<style>
:root {
  --bg: #090e1b;
  --panel: #121b2d;
  --panel-2: #1b2940;
  --line: rgba(148, 163, 184, .19);
  --purple: #8b5cf6;
  --mint: #2ce6b0;
  --text: #f7f9ff;
  --muted: #a9b7cc;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: 'Rajdhani', 'Trebuchet MS', sans-serif;
  background:
    radial-gradient(ellipse at 50% -15%, rgba(139,92,246,.22), transparent 48%),
    radial-gradient(ellipse at 100% 55%, rgba(44,230,176,.08), transparent 36%),
    var(--bg);
}
header {
  min-height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px clamp(14px, 3vw, 36px);
  border-bottom: 1px solid var(--line);
  background: rgba(10, 16, 30, .88);
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
}
.brand {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(15px, 2vw, 19px);
  font-weight: 900;
  letter-spacing: 1.4px;
  white-space: nowrap;
  text-shadow: 0 0 18px rgba(139,92,246,.35);
}
.brand b {
  display: inline-grid;
  place-items: center;
  background: linear-gradient(135deg, #a78bfa, #7042e8);
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 10px;
  padding: 8px;
  margin-right: 8px;
  box-shadow: 0 5px 18px rgba(139,92,246,.32);
}
header > span {
  font-family: 'Orbitron', sans-serif;
  font-size: 10px !important;
  letter-spacing: 3px;
  color: var(--mint) !important;
}
main {
  width: min(100% - 32px, 1280px);
  margin: clamp(18px, 3vw, 34px) auto;
}
.heading { text-align: center; margin: 22px 0 26px; }
.eyebrow {
  display: inline-block;
  padding: 6px 12px;
  border: 1px solid rgba(44,230,176,.25);
  border-radius: 999px;
  background: rgba(44,230,176,.07);
  font-family: 'Orbitron', sans-serif;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--mint);
  font-weight: 800;
}
h1 {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(24px, 4.5vw, 42px);
  letter-spacing: -1.2px;
  margin: 13px 0 8px;
  text-shadow: 0 5px 28px rgba(139,92,246,.22);
}
.sub { color: var(--muted); margin: 0; font-size: 17px; font-weight: 600; }
.shell {
  background: linear-gradient(145deg, rgba(25,37,60,.98), rgba(15,24,42,.98));
  border: 1px solid rgba(148,163,184,.22);
  border-radius: 22px;
  padding: clamp(10px, 1.5vw, 17px);
  box-shadow: 0 24px 70px rgba(0,0,0,.38), 0 0 36px rgba(139,92,246,.08);
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 2px 2px 14px;
}
.game-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .3px;
}
.actions { display: flex; flex-wrap: wrap; gap: 9px; }
button {
  min-height: 43px;
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 10px 17px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .4px;
  cursor: pointer;
  transition: transform .16s ease, filter .16s ease, box-shadow .16s ease;
  touch-action: manipulation;
}
button:hover { transform: translateY(-2px); filter: brightness(1.08); }
button:active { transform: translateY(0) scale(.98); }
button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.full {
  color: #06251d;
  background: linear-gradient(135deg, #45f0c0, #20c997);
  box-shadow: 0 7px 20px rgba(32,201,151,.2);
}
.reload {
  color: #eef2ff;
  background: linear-gradient(135deg, #35435d, #26334b);
  border-color: rgba(255,255,255,.08);
}
.frame-wrap {
  position: relative;
  width: 100%;
  height: clamp(460px, 72vh, 780px);
  height: clamp(460px, 72dvh, 780px);
  background: #061326;
  border: 1px solid rgba(148,163,184,.2);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: inset 0 0 28px rgba(0,0,0,.35);
}
iframe { display: block; width: 100%; height: 100%; border: 0; background: #061326; }
.credit {
  margin: 11px 2px 0;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
}
.credit a { color: #c4b5fd; text-decoration: none; }
.credit a:hover { text-decoration: underline; }
.hint {
  text-align: center;
  color: #91a1ba;
  font-size: 13px;
  line-height: 1.45;
  padding: 10px 8px 2px;
}
body.expanded { overflow: hidden; background: #050a14; }
body.expanded header,
body.expanded .heading,
body.expanded .credit,
body.expanded .hint { display: none; }
body.expanded main { width: 100%; max-width: none; margin: 0; }
body.expanded .shell {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: #080b12;
}
body.expanded .toolbar { flex: 0 0 auto; padding: 8px 12px; }
body.expanded .frame-wrap {
  flex: 1 1 auto;
  width: 100%;
  height: auto;
  min-height: 0;
  border-radius: 0;
}
@media (orientation: portrait) {
  body.expanded .frame-wrap {
    flex: 0 0 auto;
    width: min(100vw, calc((100dvh - 58px) * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    align-self: center;
    margin: auto 0;
  }
}
@media (min-width: 1500px) {
  main { width: min(100% - 64px, 1400px); }
  .frame-wrap { height: min(76vh, 900px); }
}
@media (max-width: 700px) {
  header { min-height: 60px; }
  main { width: calc(100% - 20px); margin: 14px auto 22px; }
  .heading { margin: 14px 0 19px; }
  .shell { border-radius: 16px; padding: 9px; }
  .toolbar { align-items: stretch; flex-direction: column; gap: 10px; padding: 2px 1px 10px; }
  .game-name { font-size: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { width: 100%; min-height: 44px; padding: 9px 8px; font-size: 15px; }
  .frame-wrap { height: auto; min-height: 0; max-height: none; aspect-ratio: 16 / 9; border-radius: 10px; }
  .credit, .hint { font-size: 12px; }
}
@media (max-width: 380px) {
  main { width: calc(100% - 14px); }
  .brand { font-size: 14px; }
  .brand b { padding: 7px; margin-right: 5px; }
}
@media (orientation: landscape) and (max-height: 500px) {
  .frame-wrap { height: 78vh; height: 78dvh; min-height: 250px; }
  body.expanded .frame-wrap {
    height: calc(100vh - 58px);
    height: calc(100dvh - 58px);
  }
}

/* Abertura premium */
.intro-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 24px;
  background:
    radial-gradient(circle at 50% 42%, rgba(139,92,246,.25), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(44,230,176,.12), transparent 42%),
    #070b15;
  transition: opacity .75s ease, visibility .75s ease;
}
.intro-screen::before,
.intro-screen::after {
  content: "";
  position: absolute;
  width: min(78vw, 620px);
  aspect-ratio: 1;
  border: 1px solid rgba(167,139,250,.13);
  border-radius: 50%;
  animation: intro-orbit 12s linear infinite;
}
.intro-screen::after {
  width: min(58vw, 450px);
  border-color: rgba(44,230,176,.13);
  animation-direction: reverse;
  animation-duration: 9s;
}
.intro-screen.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
.intro-content {
  position: relative;
  z-index: 1;
  width: min(100%, 420px);
  text-align: center;
  animation: intro-rise .9s cubic-bezier(.2,.8,.2,1) both;
}
.intro-mark {
  width: 92px;
  height: 92px;
  display: grid;
  place-items: center;
  margin: 0 auto 25px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 26px;
  background: linear-gradient(145deg, #a78bfa, #6d3fe0 65%, #4c2aa9);
  box-shadow: 0 0 28px rgba(139,92,246,.42), 0 18px 55px rgba(0,0,0,.4);
  color: white;
  font: 900 31px 'Orbitron', sans-serif;
  letter-spacing: -2px;
  animation: intro-pulse 2s ease-in-out infinite;
}
.intro-kicker {
  color: var(--mint);
  font: 700 10px 'Orbitron', sans-serif;
  letter-spacing: 4px;
  margin-bottom: 13px;
}
.intro-title {
  color: #fff;
  font: 900 clamp(25px, 7vw, 38px) 'Orbitron', sans-serif;
  letter-spacing: -1.5px;
  line-height: 1.2;
  text-shadow: 0 0 30px rgba(167,139,250,.25);
}
.intro-subtitle {
  margin-top: 12px;
  color: #a9b7cc;
  font: 600 17px 'Rajdhani', sans-serif;
  letter-spacing: 1px;
}
.intro-loader {
  width: min(230px, 75%);
  height: 4px;
  margin: 34px auto 0;
  overflow: hidden;
  border-radius: 99px;
  background: rgba(255,255,255,.12);
}
.intro-loader span {
  display: block;
  width: 42%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--purple), var(--mint));
  box-shadow: 0 0 14px rgba(44,230,176,.65);
  animation: intro-loading 1.65s ease-in-out infinite;
}
.intro-skip {
  margin-top: 27px;
  padding: 8px 15px;
  min-height: 36px;
  border: 1px solid rgba(255,255,255,.17);
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  color: #cbd5e1;
  font: 700 12px 'Rajdhani', sans-serif;
  letter-spacing: 1px;
}
@keyframes intro-rise {
  from { opacity: 0; transform: translateY(24px) scale(.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes intro-pulse {
  0%, 100% { transform: translateY(0); box-shadow: 0 0 28px rgba(139,92,246,.42), 0 18px 55px rgba(0,0,0,.4); }
  50% { transform: translateY(-7px); box-shadow: 0 0 42px rgba(139,92,246,.6), 0 24px 60px rgba(0,0,0,.45); }
}
@keyframes intro-loading {
  0% { transform: translateX(-110%); }
  100% { transform: translateX(250%); }
}
@keyframes intro-orbit { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .intro-content, .intro-mark, .intro-screen::before, .intro-screen::after, .intro-loader span {
    animation: none !important;
  }
  .intro-screen { transition: none; }
}

</style>
</head>
<body>
<div class="intro-screen" id="introScreen" aria-label="Abertura DS Subway">
  <div class="intro-content">
    <div class="intro-mark">DS</div>
    <div class="intro-kicker">DS GAMES PRESENTS</div>
    <div class="intro-title">SUBWAY<br>SURFERS</div>
    <div class="intro-subtitle">PREPARE-SE PARA JOGAR</div>
    <div class="intro-loader"><span></span></div>
    <button class="intro-skip" id="skipIntro" type="button">PULAR ABERTURA</button>
  </div>
</div>
<header><div class="brand"><b>DS</b>SUBWAY</div><span style="font-size:12px;color:#aab4c5">ARCADE</span></header>
<main>
  <section class="heading"><div class="eyebrow">DS GAMES</div><h1>Subway Surfers</h1><p class="sub">Jogue nesta página.</p></section>
  <section class="shell" id="gameShell">
    <div class="toolbar"><div class="game-name">🎮 Subway Surfers</div><div class="actions"><button class="reload" id="reload">Recarregar</button><button class="full" id="fullscreen">Tela cheia ⛶</button></div></div>
    <div class="frame-wrap">
      <iframe id="gameFrame" title="Subway Surfers incorporado via MadKidGames" src="https://www.madkidgames.com/full/subway-surfers" allow="fullscreen; autoplay; gamepad" allowfullscreen scrolling="no" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <p class="credit">Jogo incorporado via <a href="https://www.madkidgames.com/game/subway-surfers" target="_blank" rel="noopener noreferrer">MadKidGames</a>.</p>
  </section>
</main>
<script>
const frame=document.getElementById('gameFrame');

const intro = document.getElementById('introScreen');
let introClosed = false;
function closeIntro() {
  if (introClosed) return;
  introClosed = true;
  intro.classList.add('leaving');
  window.setTimeout(() => intro.remove(), 800);
}
document.getElementById('skipIntro').addEventListener('click', closeIntro);
// Abertura curta para não prender o jogador caso o provedor demore a carregar.
window.setTimeout(closeIntro, 3200);

document.getElementById('reload').addEventListener('click',()=>{frame.src=frame.src;});
document.getElementById('fullscreen').addEventListener('click',async()=>{
  const target=document.getElementById('gameShell');
  try {
    if(!document.fullscreenElement){await target.requestFullscreen();document.body.classList.add('expanded');}
    else {await document.exitFullscreen();}
  } catch(e) { alert('Tela cheia não está disponível neste navegador.'); }
});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('expanded');});
</script>
</body>
</html>
